name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 编译前端
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable

      - name: Build Web
        working-directory: ./web
        run: |
          pnpm install
          pnpm build

      # 2. 将编译好的前端产物放进 Go 嵌入目录并清理 .dockerignore 中的 dist 忽略
      - name: Prepare Go Static Files
        run: |
          mkdir -p server/router/frontend/dist
          cp -r web/dist/* server/router/frontend/dist/
          # 确保根目录的 .dockerignore 不会过滤掉我们刚刚生成的静态文件
          if [ -f .dockerignore ]; then
            sed -i '/dist/d' .dockerignore
          fi

      # 3. 登录阿里云
      - name: Login to Aliyun Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 生成编译 Dockerfile
      - name: Create Dockerfile
        run: |
          cat << 'EOF' > Dockerfile
          FROM golang:alpine AS builder
          WORKDIR /app
          ENV GOTOOLCHAIN=auto
          RUN apk add --no-cache gcc musl-dev git
          COPY go.mod go.sum ./
          RUN go mod download
          COPY . .
          RUN CGO_ENABLED=1 GOOS=linux go build -trimpath -ldflags="-s -w" -o memos ./cmd/memos

          FROM alpine:latest
          WORKDIR /var/opt/memos
          RUN apk add --no-cache tzdata ca-certificates
          COPY --from=builder /app/memos /usr/local/bin/memos
          VOLUME /var/opt/memos
          EXPOSE 5230
          ENTRYPOINT ["memos"]
          EOF

      # 5. 构建并推送
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: registry.cn-hangzhou.aliyuncs.com/rabbitwx-images/memos:latest
