name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 移除 .dockerignore 限制
      - name: Remove Dockerignore
        run: rm -f .dockerignore

      # 2. 登录阿里云
      - name: Login to Aliyun Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 容器内完整多阶段构建
      - name: Create Dockerfile
        run: |
          cat << 'EOF' > Dockerfile
          # --- Stage 1: 前端编译 ---
          FROM node:22-alpine AS frontend
          WORKDIR /web
          RUN corepack enable
          COPY web/package.json web/pnpm-lock.yaml ./
          RUN pnpm install --no-frozen-lockfile
          COPY web/ ./
          RUN pnpm build

          # --- Stage 2: Go 后端编译 ---
          FROM golang:alpine AS backend
          WORKDIR /app
          ENV GOTOOLCHAIN=auto
          RUN apk add --no-cache gcc musl-dev git
          COPY go.mod go.sum ./
          RUN go mod download
          # 先拷贝整个项目源码
          COPY . .
          # 强制清理并用 Stage 1 编译出来的高德前端产物精准替换
          RUN rm -rf /app/server/router/frontend/dist
          COPY --from=frontend /web/dist /app/server/router/frontend/dist
          RUN CGO_ENABLED=1 GOOS=linux go build -trimpath -ldflags="-s -w" -o memos ./cmd/memos

          # --- Stage 3: 最小运行镜像 ---
          FROM alpine:latest
          WORKDIR /var/opt/memos
          RUN apk add --no-cache tzdata ca-certificates
          COPY --from=backend /app/memos /usr/local/bin/memos
          VOLUME /var/opt/memos
          EXPOSE 5230
          ENTRYPOINT ["memos"]
          EOF

      # 4. 构建并推送
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: registry.cn-hangzhou.aliyuncs.com/rabbitwx-images/memos:latest
